<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#e8e0d2" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Mi Vida — Emmanuel</title>
<style>
  :root{
    --bg:#e8e0d2; --bg2:#f3eee4; --card:#ffffff; --card2:#f4efe6;
    --line:#e5ddcd; --line2:#ece5d8; --txt:#241f19; --mut:#8b8173; --mut2:#b6ad9d;
    --acc:#2b2620; --acc2:#4a4036;
    --ok:#2f9e5b; --warn:#c68a1c; --bad:#d64848;
    --money:#3a7d4d; --food:#c56a34; --gym:#6a4fd0; --uni:#1f97a8;
    --r:20px; --sh:0 6px 22px rgba(90,74,50,.10); --sh2:0 2px 10px rgba(90,74,50,.07);
    --serif:'Times New Roman', Times, Georgia, serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:var(--serif);
    font-size:16px; line-height:1.45; padding-bottom:90px;
    padding-top:env(safe-area-inset-top);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-weight:700;font-family:var(--serif);letter-spacing:-.1px}
  button{font-family:var(--serif);cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:var(--serif);font-size:16px}
  .hide{display:none!important}

  /* Header */
  header{
    position:sticky;top:0;z-index:20;background:rgba(232,224,210,.86);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 14px) 20px 14px;
  }
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hello{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-style:italic}
  .htitle{font-size:28px;margin-top:2px;font-weight:700}
  .coachbtn{
    display:flex;align-items:center;gap:7px;background:var(--acc);
    color:#f3eee4;font-weight:700;font-size:15px;padding:10px 16px;border-radius:999px;box-shadow:var(--sh2)
  }

  /* Layout */
  main{padding:18px 16px 8px;max-width:640px;margin:0 auto}
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sectitle{display:flex;align-items:center;justify-content:space-between;margin:24px 4px 12px}
  .sectitle:first-child{margin-top:8px}
  .sectitle h2{font-size:20px}
  .sectitle .sub{font-size:13px;color:var(--mut)}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:18px;margin-bottom:13px;box-shadow:var(--sh2)}
  .card.tap{transition:transform .06s}
  .card.tap:active{transform:scale(.99)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .stat{background:var(--card);border:1px solid var(--line2);border-radius:var(--r);padding:16px;box-shadow:var(--sh2)}
  .stat .lbl{font-size:13px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .stat .val{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.5px}
  .stat .sm{font-size:13px;color:var(--mut);margin-top:2px}

  /* Progress */
  .bar{height:9px;background:var(--bg);border-radius:999px;overflow:hidden;margin-top:9px}
  .bar > span{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .ring{--p:0;--c:var(--acc);width:64px;height:64px;border-radius:50%;
    background:conic-gradient(var(--c) calc(var(--p)*1%), var(--bg) 0);
    display:grid;place-items:center;flex:none}
  .ring > i{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px}

  /* Pills / chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:9px 14px;border-radius:999px;font-size:14px;font-weight:600}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#f3eee4}
  .tag{font-size:12px;padding:3px 9px;border-radius:999px;font-weight:700}

  /* List rows */
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
  .row:last-child{border-bottom:none}
  .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--card2)}
  .row .mid{flex:1;min-width:0}
  .row .mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mid .s{font-size:13px;color:var(--mut);margin-top:1px}
  .row .amt{font-weight:700;font-size:16px}
  .muted{color:var(--mut)}
  .empty{text-align:center;color:var(--mut);padding:28px 10px;font-size:15px}
  .empty .big{font-size:32px;margin-bottom:6px}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--acc);color:#f3eee4;font-weight:700;padding:14px 16px;border-radius:14px;font-size:16px;width:100%;box-shadow:var(--sh2)}
  .btn.sec{background:var(--card);border:1px solid var(--line);color:var(--txt);box-shadow:var(--sh2)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);box-shadow:none}
  .btn.sm{width:auto;padding:9px 14px;font-size:14px;border-radius:11px}
  .btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad);box-shadow:none}
  .addbtn{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;color:var(--txt);box-shadow:var(--sh2)}

  /* Bottom nav */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(243,238,228,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:9px 6px calc(env(safe-area-inset-bottom) + 9px)
  }
  nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut2);font-size:10px;font-weight:600;flex:1;padding:4px;white-space:nowrap}
  nav button .ni{width:25px;height:25px;display:block;margin-bottom:1px}
  nav button.on .ni{stroke:var(--acc)}
  nav button.on{color:var(--acc)}

  /* Modal / sheet */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(50,40,26,.4);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  .sheet{background:var(--bg2);width:100%;max-width:640px;border-radius:26px 26px 0 0;border:1px solid var(--line);
    padding:8px 20px calc(env(safe-area-inset-bottom) + 22px);max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grip{width:42px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 16px}
  .sheet h3{font-size:22px;margin-bottom:14px}
  label.f{display:block;font-size:13px;color:var(--mut);margin:13px 0 6px;font-weight:600}
  .in{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:14px;outline:none}
  .in:focus{border-color:var(--acc)}
  textarea.in{min-height:82px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .seg button{flex:1;padding:12px 6px;background:none;color:var(--mut);font-weight:700;font-size:14px}
  .seg button.on{background:var(--acc);color:#f3eee4}

  .hint{font-size:13px;color:var(--mut);margin-top:6px}
  .banner{border-radius:16px;padding:15px;margin-bottom:13px;font-size:14.5px;line-height:1.5;border:1px solid}
  .banner.info{background:#fbf8f1;border-color:var(--line)}
  .banner.warn{background:#fbf1de;border-color:#eccf94;color:#7a5a12}
  .banner.ok{background:#e9f6ee;border-color:#b3e0c4;color:#1f6e3e}
  .banner b{color:var(--txt)}
  .coachmsg{white-space:pre-wrap;line-height:1.6;font-size:15.5px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .kpi{display:flex;gap:10px;align-items:center}
  .divider{height:1px;background:var(--line2);margin:15px 0}
  .link{color:var(--gym);text-decoration:underline;font-weight:600}
  .small{font-size:13px}
  .center{text-align:center}

  /* Calendario */
  .cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 14px}
  .cal-head h2{font-size:19px;text-transform:capitalize;text-align:center;flex:1}
  .cal-nav{display:flex;gap:8px}
  .cal-nav button{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;color:var(--txt);box-shadow:var(--sh2)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
  .cal-dow{text-align:center;font-size:11px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
  .cal-cell{aspect-ratio:1/1.12;background:var(--card);border:1px solid var(--line2);border-radius:13px;padding:6px 3px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:var(--sh2);transition:transform .06s}
  .cal-cell.has{cursor:pointer}
  .cal-cell.has:active{transform:scale(.95)}
  .cal-cell.out{background:transparent;border:none;box-shadow:none;pointer-events:none}
  .cal-cell.today{border-color:var(--acc);border-width:2px}
  .cal-num{font-size:14px;font-weight:700;line-height:1}
  .cal-cell.today .cal-num{color:var(--acc)}
  .cal-dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;min-height:7px}
  .cal-dot{width:7px;height:7px;border-radius:50%}
  .cal-spend{font-size:9px;color:var(--money);font-weight:700;line-height:1;margin-top:auto}
  .cal-legend{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:14px;font-size:12px;color:var(--mut)}
  .cal-legend span{display:inline-flex;align-items:center;gap:5px}
  .cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block}

  /* Burbuja flotante del Coach (estilo Messenger) */
  .coach-fab{
    position:fixed; z-index:40; right:16px; bottom:calc(env(safe-area-inset-bottom) + 92px);
    width:60px; height:60px; border-radius:50%; padding:0;
    background:var(--acc); border:2px solid #f3eee4;
    box-shadow:0 8px 22px rgba(90,74,50,.38);
    display:grid; place-items:center; touch-action:none;
    animation:fabBob 3s ease-in-out infinite; transition:box-shadow .2s, transform .1s;
  }
  .coach-fab:active{transform:scale(.94)}
  .coach-fab svg{width:38px;height:38px;display:block;pointer-events:none}
  .coach-fab .fab-dot{position:absolute;top:-2px;right:-2px;width:15px;height:15px;border-radius:50%;background:var(--gym);border:2px solid #f3eee4}
  .coach-fab.dragging{animation:none;box-shadow:0 14px 30px rgba(90,74,50,.5);transition:none}
  @keyframes fabBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="hello" id="greeting">Hola</div>
      <div class="htitle" id="headerTitle">Inicio</div>
    </div>
    <button class="coachbtn" onclick="openCoach()">✦ Coach</button>
  </div>
</header>

<main id="app"></main>

<nav id="nav">
  <button data-view="inicio" class="on" onclick="go('inicio')">
    <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg>Inicio</button>
  <button data-view="calendario" onclick="go('calendario')">
    <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.2v3.6M16 3.2v3.6"/></svg>Calendario</button>
  <button data-view="dinero" onclick="go('dinero')">
    <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 6.8v10.4"/><path d="M14.6 9.2c-.5-.9-1.5-1.3-2.6-1.3-1.5 0-2.6.8-2.6 2s1 1.7 2.6 2.1 2.6.9 2.6 2.1-1.1 2-2.6 2c-1.1 0-2.1-.4-2.6-1.3"/></svg>Dinero</button>
  <button data-view="comida" onclick="go('comida')">
    <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v4M9.5 3v4M12 3v4M9.5 7v14M7 7h5"/><path d="M17.5 3c1.3 0 2 1.7 2 4.2s-.7 4-2 4V3z"/><path d="M17.5 11.2V21"/></svg>Comida</button>
  <button data-view="gym" onclick="go('gym')">
    <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 8.5v7M4 10v4M17.5 8.5v7M20 10v4M6.5 12h11"/></svg>Gym</button>
  <button data-view="uni" onclick="go('uni')">
    <svg class="ni" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 2.5 8.5 12 13l9.5-4.5L12 4z"/><path d="M6.5 10.6V15c0 1.3 2.5 2.6 5.5 2.6s5.5-1.3 5.5-2.6v-4.4"/><path d="M21.5 8.7v4.8"/></svg>Uni</button>
</nav>

<button id="coachFab" class="coach-fab" aria-label="Abrir Coach" hidden>
  <span class="fab-dot"></span>
  <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <line x1="24" y1="7" x2="24" y2="12" stroke="#f3eee4" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="6" r="2.4" fill="#f3eee4"/>
    <rect x="9" y="16" width="30" height="24" rx="9" fill="#f3eee4"/>
    <rect x="5" y="23" width="4" height="9" rx="2" fill="#f3eee4"/>
    <rect x="39" y="23" width="4" height="9" rx="2" fill="#f3eee4"/>
    <circle cx="19" cy="27" r="3.2" fill="#2b2620"/>
    <circle cx="29" cy="27" r="3.2" fill="#2b2620"/>
    <path d="M19 33.3c2 1.9 8 1.9 10 0" stroke="#2b2620" stroke-width="2" stroke-linecap="round"/>
  </svg>
</button>

<div id="sheetRoot"></div>

<script src="app.js"></script>
</body>
</html>
