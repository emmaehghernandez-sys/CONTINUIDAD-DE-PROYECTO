<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0e1116" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<title>Mi Vida — Emmanuel</title>
<style>
  :root{
    --bg:#0e1116; --bg2:#161b22; --card:#1b2230; --card2:#222b3a;
    --line:#2a3444; --txt:#e8edf4; --mut:#8b98a9; --mut2:#5f6b7c;
    --acc:#4f8cff; --acc2:#7c5cff; --ok:#2ec16b; --warn:#ffb020; --bad:#ff5c5c;
    --money:#2ec16b; --food:#ff8a4c; --gym:#7c5cff; --uni:#28c3d7;
    --r:16px; --sh:0 6px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px; line-height:1.45; padding-bottom:88px;
    padding-top:env(safe-area-inset-top);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.2px}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit}
  input,select,textarea{font-family:inherit;font-size:15px}
  .hide{display:none!important}

  /* Header */
  header{
    position:sticky;top:0;z-index:20;background:rgba(14,17,22,.82);
    backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;
  }
  .hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .hello{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
  .htitle{font-size:20px;margin-top:2px}
  .coachbtn{
    display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,var(--acc),var(--acc2));
    color:#fff;font-weight:700;font-size:13px;padding:9px 13px;border-radius:999px;box-shadow:var(--sh)
  }

  /* Layout */
  main{padding:16px 16px 8px;max-width:640px;margin:0 auto}
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sectitle{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
  .sectitle:first-child{margin-top:6px}
  .sectitle h2{font-size:17px}
  .sectitle .sub{font-size:12px;color:var(--mut)}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
  .card.tap{transition:transform .06s}
  .card.tap:active{transform:scale(.99)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .stat .lbl{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
  .stat .val{font-size:24px;font-weight:800;margin-top:6px;letter-spacing:-.5px}
  .stat .sm{font-size:12px;color:var(--mut);margin-top:2px}

  /* Progress */
  .bar{height:9px;background:var(--bg2);border-radius:999px;overflow:hidden;margin-top:9px}
  .bar > span{display:block;height:100%;border-radius:999px;transition:width .4s ease}
  .ring{--p:0;--c:var(--acc);width:64px;height:64px;border-radius:50%;
    background:conic-gradient(var(--c) calc(var(--p)*1%), var(--bg2) 0);
    display:grid;place-items:center;flex:none}
  .ring > i{width:50px;height:50px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}

  /* Pills / chips */
  .chips{display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);
    padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .tag{font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700}

  /* List rows */
  .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:none}
  .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;flex:none;background:var(--card2)}
  .row .mid{flex:1;min-width:0}
  .row .mid .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .mid .s{font-size:12px;color:var(--mut);margin-top:1px}
  .row .amt{font-weight:800;font-size:15px}
  .muted{color:var(--mut)}
  .empty{text-align:center;color:var(--mut);padding:26px 10px;font-size:14px}
  .empty .big{font-size:30px;margin-bottom:6px}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--acc);color:#fff;font-weight:700;padding:13px 16px;border-radius:12px;font-size:15px;width:100%}
  .btn.sec{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
  .btn.sm{width:auto;padding:9px 13px;font-size:13px;border-radius:10px}
  .btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
  .addbtn{width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--line);font-size:20px;display:grid;place-items:center;color:var(--txt)}

  /* Bottom nav */
  nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(22,27,34,.9);backdrop-filter:blur(14px);border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)
  }
  nav button{background:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mut2);font-size:10.5px;font-weight:600;flex:1;padding:4px}
  nav button .ni{font-size:21px;line-height:1}
  nav button.on{color:var(--acc)}

  /* Modal / sheet */
  .sheet-bg{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
  .sheet{background:var(--bg2);width:100%;max-width:640px;border-radius:22px 22px 0 0;border:1px solid var(--line);
    padding:8px 18px calc(env(safe-area-inset-bottom) + 20px);max-height:92vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1)}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  .grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:8px auto 14px}
  .sheet h3{font-size:18px;margin-bottom:14px}
  label.f{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 6px;font-weight:600}
  .in{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:13px 14px;outline:none}
  .in:focus{border-color:var(--acc)}
  textarea.in{min-height:78px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .seg button{flex:1;padding:11px 6px;background:none;color:var(--mut);font-weight:700;font-size:13px}
  .seg button.on{background:var(--acc);color:#fff}

  .hint{font-size:12px;color:var(--mut);margin-top:6px}
  .banner{border-radius:14px;padding:14px;margin-bottom:12px;font-size:13.5px;line-height:1.5;border:1px solid}
  .banner.info{background:rgba(79,140,255,.09);border-color:rgba(79,140,255,.3)}
  .banner.warn{background:rgba(255,176,32,.09);border-color:rgba(255,176,32,.35);color:#ffd98a}
  .banner.ok{background:rgba(46,193,107,.09);border-color:rgba(46,193,107,.32);color:#9be9bd}
  .banner b{color:var(--txt)}
  .coachmsg{white-space:pre-wrap;line-height:1.6;font-size:14.5px}
  .spin{width:22px;height:22px;border:2.5px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}
  .kpi{display:flex;gap:10px;align-items:center}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .link{color:var(--acc);text-decoration:underline;font-weight:600}
  .small{font-size:12px}
  .center{text-align:center}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="hello" id="greeting">Hola</div>
      <div class="htitle" id="headerTitle">Inicio</div>
    </div>
    <button class="coachbtn" onclick="openCoach()">✦ Coach</button>
  </div>
</header>

<main id="app"></main>

<nav id="nav">
  <button data-view="inicio" class="on" onclick="go('inicio')"><span class="ni">🏠</span>Inicio</button>
  <button data-view="dinero" onclick="go('dinero')"><span class="ni">💰</span>Dinero</button>
  <button data-view="comida" onclick="go('comida')"><span class="ni">🍽️</span>Comida</button>
  <button data-view="gym" onclick="go('gym')"><span class="ni">🏋️</span>Gym</button>
  <button data-view="uni" onclick="go('uni')"><span class="ni">🎓</span>Uni</button>
</nav>

<div id="sheetRoot"></div>

<script src="app.js"></script>
</body>
</html>
